<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6b3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vistorias Fumo">
<title>Vistorias Fumo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f1ea; --card:#ffffff; --txt:#1e2420; --mut:#66706a; --line:#d9d4c7;
  --pri:#2f6b3a; --pri-d:#245230; --acc:#b5651d; --ok:#2e7d32; --warn:#b26a00; --err:#b3261e;
  --badge-rasc:#e6e2d6; --badge-pronta:#fff0d6; --badge-env:#dcefdd; --badge-erro:#fbe0de; --badge-enviando:#dde8fb;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#15191a; --card:#1f2527; --txt:#e8e6df; --mut:#a6ada7; --line:#3a4245; --pri:#5fae6e; --pri-d:#3f8a4e;
    --badge-rasc:#33393b; --badge-pronta:#4a3a1c; --badge-env:#1f3d24; --badge-erro:#4a2320; --badge-enviando:#22324a; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700}
.tela{display:none;min-height:100vh;padding-bottom:110px}
.tela.ativa{display:block}
header.topo{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
header.topo h1{font-size:18px;flex:1;line-height:1.2}
header.topo small{display:block;font-weight:400;opacity:.85;font-size:12px}
header.topo button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;padding:8px 12px;font-size:15px}
main{padding:12px 12px 0;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card.lista{display:flex;gap:10px;align-items:center;cursor:pointer}
.card.lista .info{flex:1;min-width:0}
.card.lista .nome{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.lista .meta{color:var(--mut);font-size:13px;margin-top:2px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st-rascunho{background:var(--badge-rasc)} .st-pronta{background:var(--badge-pronta);color:var(--warn)} .st-enviada{background:var(--badge-env);color:var(--ok)} .st-erro{background:var(--badge-erro);color:var(--err)} .st-enviando{background:var(--badge-enviando)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;min-height:46px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.perigo{color:var(--err);border-color:var(--err)}
.btn.bloco{width:100%}
.btn.peq{padding:8px 12px;min-height:38px;font-size:14px}
.btn:disabled{opacity:.5}
.secao{margin-bottom:12px;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.secao>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:10px;background:var(--card)}
.secao>summary::-webkit-details-marker{display:none}
.secao>summary .num{background:var(--pri);color:#fff;border-radius:8px;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.secao>summary .seta{margin-left:auto;color:var(--mut);transition:transform .2s}
.secao[open]>summary .seta{transform:rotate(90deg)}
.secao>.corpo{padding:4px 14px 14px;border-top:1px solid var(--line)}
.dica{color:var(--mut);font-size:13px;margin:6px 0 10px}
.aviso{background:#fff7e0;color:#6b4d00;border:1px solid #f1d78a;border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
@media (prefers-color-scheme: dark){.aviso{background:#3d3115;color:#f2d98a;border-color:#6b5820}}
.campo{margin:10px 0}
.campo label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-bottom:4px;text-transform:uppercase;letter-spacing:.02em}
.campo .hint{display:block;font-size:12px;color:var(--mut);margin-top:3px;font-weight:400;text-transform:none;letter-spacing:0}
.campo input[type=text],.campo input[type=date],.campo input[type=time],.campo input[type=number],.campo input[type=tel],.campo input[type=email],.campo input[type=url],.campo select,.campo textarea{
  width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--bg);font-size:16px;min-height:46px}
.campo textarea{min-height:80px;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:2px solid var(--pri);border-color:var(--pri)}
.linha2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.linha2{grid-template-columns:1fr}}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--bg);cursor:pointer;font-size:15px}
.chk input{width:20px;height:20px;margin:0;accent-color:var(--pri)}
.chk.on{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,var(--bg))}
.subcard{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
.subcard>.sc-head{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:4px}
.subcard>.sc-head .x{margin-left:auto}
.fotogrupo{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;background:var(--bg)}
.fg-head{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.fg-head .cnt{margin-left:auto;color:var(--mut);font-size:13px;font-weight:400}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.thumbs img{width:78px;height:78px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.thumbs .env{position:relative}
.thumbs .env::after{content:"✓";position:absolute;right:3px;bottom:3px;background:var(--ok);color:#fff;font-size:11px;border-radius:999px;width:18px;height:18px;display:flex;align-items:center;justify-content:center}
.fg-btns{display:flex;gap:8px}
.fg-btns .btn{flex:1;padding:9px;min-height:42px;font-size:14px}
.docrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:10px 0}
.docrow:last-child{border-bottom:0}
.docrow .chk{flex:1;min-width:180px}
.docrow .fotos-doc{width:100%}
.rodape{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:30}
.rodape .inner{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:center}
.status-sync{font-size:13px;color:var(--mut);flex:1;min-width:0}
.status-sync b{color:var(--txt)}
.pt{display:inline-block;width:9px;height:9px;border-radius:999px;background:#999;margin-right:5px}
.pt.on{background:var(--ok)} .pt.off{background:var(--err)}
.canvas-ass{width:100%;height:180px;border:1px solid var(--line);border-radius:12px;background:#fff;touch-action:none;display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;padding:12px}
.modal.ativa{display:flex}
.modal img{max-width:100%;max-height:75vh;border-radius:8px}
.modal .acoes{display:flex;gap:10px;margin-top:12px}
.modal .acoes .btn{background:#222;color:#fff;border-color:#444}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.busca-res{border:1px solid var(--line);border-radius:10px;background:var(--card);margin-top:4px;overflow:hidden;display:none}
.busca-res.on{display:block}
.busca-res .item{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.busca-res .item:last-child{border-bottom:0}
.busca-res .item b{display:block}
.busca-res .item small{color:var(--mut)}
.gps{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vazio{text-align:center;color:var(--mut);padding:40px 12px}
.pill{font-size:12px;background:var(--badge-rasc);border-radius:999px;padding:2px 8px}
.pill.fogo{background:#c0392b;color:#fff;font-weight:700}
.subcard.fogo{border:1px solid #c0392b;background:color-mix(in srgb,#c0392b 5%,var(--card))}
.secao.fogo{border-color:#c0392b}
.progresso{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.progresso>div{height:100%;background:var(--pri);width:0;transition:width .3s}
.calc{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:15px}
.calc b{font-size:18px}
.ok{color:var(--ok)} .erro{color:var(--err)} .warn{color:var(--warn)}
kbd{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:13px}
</style>
</head>
<body>

<!-- ===================== TELA: LISTA ===================== -->
<section id="tela-lista" class="tela ativa">
  <header class="topo">
    <img src="icon-192.png" alt="" width="34" height="34" style="border-radius:8px">
    <h1>Vistorias Fumo <small>Safra 2026/2027 — laudo prejuízo por falta de energia</small></h1>
    <button id="btn-config" title="Configurações">⚙</button>
  </header>
  <main>
    <button id="btn-nova" class="btn pri bloco" style="font-size:17px">＋ Nova vistoria</button>
    <div id="lista" style="margin-top:12px"></div>
  </main>
  <div class="rodape"><div class="inner">
    <div class="status-sync" id="status-sync"></div>
    <button id="btn-sync" class="btn acc peq">Enviar agora</button>
  </div></div>
</section>

<!-- ===================== TELA: CONFIG ===================== -->
<section id="tela-config" class="tela">
  <header class="topo">
    <button class="voltar">‹ Voltar</button>
    <h1>Configurações</h1>
  </header>
  <main>
    <div class="card">
      <div class="campo"><label>Nome do vistoriador (quem preenche neste celular)</label><input type="text" id="cfg-vistoriador" placeholder="ex.: Dra. Fulana / Estagiário João"></div>
      <div class="campo"><label>URL do script do Google (termina em /exec)</label><input type="url" id="cfg-url" placeholder="https://script.google.com/macros/s/.../exec" inputmode="url"></div>
      <div class="campo"><label>Chave da equipe</label><input type="text" id="cfg-chave" placeholder="a mesma chave definida no script"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button id="cfg-salvar" class="btn pri">Salvar</button>
        <button id="cfg-testar" class="btn">Testar conexão</button>
      </div>
      <div id="cfg-resultado" class="dica" style="margin-top:8px"></div>
    </div>
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:6px">Armazenamento neste celular</h3>
      <div id="cfg-storage" class="dica">…</div>
      <div class="dica">Os dados ficam guardados no aparelho até serem enviados. Não limpe os dados do Chrome nem desinstale o app com vistorias pendentes.</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">
        <button id="cfg-backup" class="btn peq">Exportar backup (.json)</button>
        <label class="btn peq" style="cursor:pointer">Importar backup <input type="file" id="cfg-importar" accept="application/json" hidden></label>
      </div>
    </div>
    <div class="card dica">Versão <span id="versao"></span> · <button id="cfg-atualizar" class="btn peq">Verificar atualização</button></div>
  </main>
</section>

<!-- ===================== TELA: VISTORIA ===================== -->
<section id="tela-vistoria" class="tela">
  <header class="topo">
    <button class="voltar">‹ Lista</button>
    <h1 id="v-titulo">Vistoria <small id="v-sub"></small></h1>
    <span id="v-salvo" style="font-size:12px;opacity:.85">salvo</span>
  </header>
  <main id="v-form"></main>
  <div class="rodape"><div class="inner" id="v-rodape"></div></div>
</section>

<input type="file" id="in-cam" accept="image/*" capture="environment" hidden>
<input type="file" id="in-gal" accept="image/*" multiple hidden>

<div class="modal" id="modal-foto">
  <img id="modal-img" alt="">
  <div id="modal-legenda" style="color:#ddd;font-size:13px;margin-top:8px;text-align:center"></div>
  <div class="acoes">
    <button class="btn" id="modal-fechar">Fechar</button>
    <button class="btn" id="modal-excluir" style="color:#ff8a80">Excluir foto</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const APP_VERSAO = '1.6.0';

/* ====================== DEFINIÇÕES (espelham a ficha em papel) ====================== */
const ESTADO_CIVIL = ['', 'Solteiro(a)', 'Casado(a)', 'União estável', 'Divorciado(a)', 'Separado(a)', 'Viúvo(a)'];
const UFS = ['PR','SC','RS','SP','MG','MS','MT','GO','BA','AL','SE','PB','PE','RN','CE','PI','MA','TO','PA','AM','AC','RO','RR','AP','ES','RJ','DF'];
const FONTES_RESERVA = [['gerador','Gerador próprio'],['solar','Energia solar com backup'],['nenhum','Nenhum']];
const CAT_ESTUFA = [['externa','Estufa externa'],['interior','Interior'],['carregamento','Carregamento'],['descartado','Material descartado'],['aproveitado','Fumo aproveitado']];
const CAT_ESTUFA_CONTINUA = [['externa','Estufa externa (casa de máquinas e boxes)'],['controlador','Painel / controlador / app com o histórico da queda'],['descartado','Material descartado (geral)'],['aproveitado','Fumo aproveitado (geral)']];
// Estufa de carga contínua: posição da folha (1ª letra da classe) → peso seco médio por folha (g); editável em cada estufa
const POSICOES = [['X','X — baixeira'],['C','C — semimeeira'],['B','B — meeira'],['T','T — ponteira']];
const PESO_FOLHA_PADRAO = { X: 5, C: 6.5, B: 8, T: 6.5 };
const FOLHAS_POR_GRAMPO_PADRAO = 300;
const MAX_BOXES = 10;
const FASES_BOX = ['', 'Recém-carregado (sem calor ainda)', 'Murcha / amarelecimento', 'Fixação de cor', 'Secagem da folha (lâmina)', 'Secagem do talo', 'Pronto, aguardando descarga'];
const FORNALHAS = ['', 'Lenha', 'Pellet', 'Dupla queima', 'Outra'];
const posicaoDaClasse = (cl) => { const l = String(cl || '').trim().toUpperCase().charAt(0); return 'XCBT'.includes(l) && l ? l : ''; };
// v1.6 — incêndio na estufa
const CAT_INCENDIO = [['fogo-geral','🔥 Visão geral da estufa queimada (os 4 lados)'],['fogo-foco','🔥 Ponto de origem provável do fogo'],['fogo-padrao','🔥 Padrão de entrada / medidor / disjuntores'],['fogo-fiacao','🔥 Fiação e motor do ventilador'],['fogo-fornalha','🔥 Fornalha, chaminé e canos de calor (por dentro)'],['fogo-fumo','🔥 Fumo queimado (na estufa e no paiol)'],['fogo-bens','🔥 Equipamentos e bens atingidos'],['fogo-aparelhos','🔥 Aparelhos queimados na casa / vizinhos'],['fogo-docs','🔥 Laudo dos bombeiros / BO / protocolos / inscrição AFUBRA']];
const SIM_NAO_NS = ['', 'Sim', 'Não', 'Não sabe'];
const QUEDA_ANTES = ['', 'Sim — queda/oscilação registrada na seção 3', 'Não houve queda de energia', 'Não sabe'];
const TEMPESTADE = ['', 'Tempo bom / sem tempestade', 'Tempestade com raios', 'Vento forte', 'Tempestade com raios e vento', 'Não sabe'];
const CONTROLADOR_REGISTRO = ['', 'Sem controlador / painel', 'Registrou alarme ou alta temperatura', 'Registrou a queda de energia', 'Não registrou nada', 'Não foi possível verificar (queimou)'];
const ORIGEM_LOCAL = ['', 'Fornalha', 'Chaminé / canos de calor', 'Quadro elétrico / padrão / disjuntores', 'Motor do ventilador', 'Fiação interna da estufa', 'Lateral / telhado (fora da área de calor)', 'Paiol / varanda anexa', 'Não identificado'];
const ORIGEM_PROVAVEL = ['', 'Elétrica externa (surto / oscilação / retorno da energia)', 'Elétrica interna (fiação / sobrecarga da estufa)', 'Fornalha / canos de calor (não elétrica)', 'Raio / descarga atmosférica', 'Indeterminada'];
const CONFIANCA = ['', 'Alta', 'Média', 'Baixa'];
const ESTADO_EQUIP = ['', 'Íntegro / sem sinais', 'Com trinca, furo ou remendo', 'Derretido / queimado', 'Não foi possível avaliar'];
const ESTADO_ITEM = ['', 'Destruído', 'Danificado', 'Intacto', 'Não tinha'];
const BENS_INCENDIO = [['estrutura','Estrutura da estufa (paredes, telhado, piso)'],['fornalha','Fornalha'],['chamine','Chaminé e canos de calor'],['ventilador','Ventilador(es) e motor(es)'],['controlador','Controlador / painel / sensores'],['eletrica','Quadro elétrico e fiação'],['grampos','Grampos'],['varas','Varas / estaleiros / gaiolas'],['lenha','Lenha / pellet estocados'],['paiol','Paiol / varanda anexa'],['outros','Outros (descrever na observação)']];
const FUMAGEIRAS = ['BAT / Souza Cruz', 'Philip Morris', 'JTI', 'Alliance One', 'Universal Leaf', 'CTA', 'Premium Tabacos', 'Tabacos Marasca', 'Outra'];
const fmtRS = (n) => (n === '' || n == null) ? '' : 'R$ ' + Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const temIncendio = () => !!V && (V.estufas || []).some(e => e.incendio === 'Sim');
const addDias = (iso, n) => { if (!iso) return ''; const d = new Date(iso + 'T12:00'); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const diasAte = (iso) => { if (!iso) return null; return Math.round((new Date(iso + 'T12:00') - new Date(hojeISO() + 'T12:00')) / 86400000); };
const CAT_GERAL = [['externa','Estufa por fora'],['interior','Interior / sistema de secagem'],['carregamento','Carregamento / fumo em cura'],['sem-energia','Estufa sem energia (foto/vídeo datado)'],['descartado','Material descartado'],['termometro','Termômetro / painel'],['padrao-luz','Padrão de luz da estufa (c/ número visível)'],['com-tecnica','Foto com a técnica']];
const CLASSES_FUMO = ['BO1','BO2','BO3','BR1','BR2','BR3','BL1','BL2','BK','TO1','TO2','TO3','TR1','TR2','TR3','TL1','TL2','TK','CO1','CO2','CO3','CR1','CR2','CR3','CL1','CL2','CK','X01','X02','X03','XR1','XR2','XR3','XL1','XL2','XK','G2','G3','N','SC','ST'];
const DOCS = [['rg','RG'],['cpf','CPF'],['certidao-casamento','Certidão de casamento'],['comprovante-residencia','Comprovante de residência atual'],['nota-produtor','Nota de produtor / nota de fumo'],['declaracao-luz-cedida','Declaração de luz cedida'],['contrato-integracao','Contrato de integração'],['conta-energia','Conta de energia / identificação da UC'],['protocolo-copel','Protocolo(s) COPEL'],['fotos-videos-produtor','Fotos / vídeos feitos pelo produtor']];
const CAMPOS_ESTUFA = [
  ['modelo','Modelo / tipo','ex.: Carijó, convencional','text','lst-modelos'],
  ['fonteEnergia','Fonte de energia','elétrica / lenha / GLP','text','lst-fontes'],
  ['metragem','Metragem / dimensões','medidas em metros — anexar foto contemporânea da estufa','text'],
  ['capacidadeTotal','Capacidade total','nº de estaleiros / grades da estufa','text'],
  ['gradesCarregadas','Grades carregadas no evento','quantas estavam efetivamente carregadas','number'],
  ['dataCarregamento','Data do carregamento','','date'],
  ['quantidadeCarregadaKg','Quantidade carregada (kg)','total de fumo que estava sendo secado na estufa','number'],
  ['capacidadeMediaGrade','Peso médio por grade (kg)','calculado: kg carregados ÷ grades carregadas','calc'],
  ['classeEstimada','Classe estimada do fumo','à época do evento','text','lst-classes'],
  ['religamento','Religamento da estufa','data e hora do religamento, temperatura adotada e por quanto tempo a cura continuou após o retorno da energia','textarea'],
  ['providencias','Providências adotadas pelo produtor','o que foi feito para preservar a qualidade do produto','textarea'],
  ['perdaTotalPct','Perda total (%)','','number'],
  ['perdaTotalKg','Perda total (kg)','calculado: % de perda sobre os kg carregados','calc'],
  ['desclassPct','Desclassificação (%)','','number'],
  ['desclassKg','Desclassificação (kg)','calculado: % de desclassificação sobre os kg carregados','calc'],
  ['desclassDe','Desclassificação — classe DE','','text','lst-classes'],
  ['desclassPara','Desclassificação — classe PARA','','text','lst-classes'],
];

/* ====================== UTILIDADES ====================== */
const $ = (s, el = document) => el.querySelector(s);

const numVal = (x) => { if (x === '' || x == null) return null; const n = Number(String(x).replace(',', '.')); return isNaN(n) ? null : n; };

function recalcularEstufa(i) {

  e.capacidadeMediaGrade = (kg != null && gr) ? r2(kg / gr) : '';

  ['capacidadeMediaGrade', 'perdaTotalKg', 'desclassKg'].forEach(k => { const el = $(`[data-calc="estufas.${i}.${k}"]`); if (el) el.innerHTML = e[k] === '' ? '—' : `<b>${fmtNum(e[k])}</b> kg`; });
}
// Incêndio: total estimado dos bens destruídos/danificados e prazo do pedido de ressarcimento (PID) na COPEL
function recalcularFogo(e, i) {

function dataFogoMaisAntiga() { return (V.estufas || []).filter(e => e.incendio === 'Sim' && e.fogo && e.fogo.data).map(e => e.fogo.data).sort()[0] || ''; }
function textoPrazoPid() {

// dia do ciclo de um box na data da 1ª queda (1 = carregado no mesmo dia)
function diaCicloBox(b) {
  const ev = (V.eventos || []).find(x => x.dataInicio); if (!ev || !b.dataCarregamento) return '';

// Estufa de carga contínua: kg seco por box = grampos × folhas por grampo × peso seco da folha (pela posição/classe);
// perda e desclassificação (kg) a partir das porcentagens; totais da estufa = soma dos boxes
function recalcularBoxes(e, i) {
  const fpg = numVal(e.folhasPorGrampo) || 0;
  let kgT = 0, perdaT = 0, descT = 0, gramposT = 0, comPrej = [];
  e.boxes.forEach((b, k) => {
    if (!b.posicao) b.posicao = posicaoDaClasse(b.classe);
    const g = numVal(b.grampos) || 0, pf = numVal(e.pesoFolha[b.posicao]) || 0;
    const inf = numVal(b.kgSecoInformado);
    if (inf != null && inf > 0) { b.kgSeco = r2(inf); b.metodo = 'informado'; }
    else { b.kgSeco = (g && fpg && pf) ? r2(g * fpg * pf / 1000) : ''; b.metodo = b.kgSeco === '' ? '' : 'estimado'; }
    b.diaCiclo = diaCicloBox(b);
    const kg = numVal(b.kgSeco), pp = numVal(b.perdaPct), dp = numVal(b.desclassPct);
    if (b.prejuizo === 'Sim' && kg != null) { b.perdaKg = pp != null ? r2(kg * pp / 100) : ''; b.desclassKg = dp != null ? r2(kg * dp / 100) : ''; b.aproveitadoKg = r2(Math.max(0, kg - (numVal(b.perdaKg) || 0) - (numVal(b.desclassKg) || 0))); }
    else if (b.prejuizo === 'Não' && kg != null) { b.perdaKg = 0; b.desclassKg = 0; b.aproveitadoKg = kg; }
    else { b.perdaKg = ''; b.desclassKg = ''; b.aproveitadoKg = ''; }
    if (kg != null) { kgT += kg; gramposT += g; perdaT += numVal(b.perdaKg) || 0; descT += numVal(b.desclassKg) || 0; }
    if (b.prejuizo === 'Sim') comPrej.push(b.numero);
    const pre = `estufas.${i}.boxes.${k}.`;
    const set = (kk, html) => { const el = $(`[data-calc="${pre}${kk}"]`); if (el) el.innerHTML = html; };
    set('kgSeco', b.kgSeco === '' ? '—' : `<b>${fmtNum(b.kgSeco)}</b> kg seco <span class="hint">${b.metodo === 'informado' ? 'informado/pesado' : `${fmtNum(g)} grampos × ${fmtNum(fpg)} folhas × ${fmtNum(pf)} g`}</span>`);
    set('perdaKg', b.perdaKg === '' ? '—' : `<b>${fmtNum(b.perdaKg)}</b> kg`);
    set('desclassKg', b.desclassKg === '' ? '—' : `<b>${fmtNum(b.desclassKg)}</b> kg`);
    set('aproveitadoKg', b.aproveitadoKg === '' ? '—' : `<b>${fmtNum(b.aproveitadoKg)}</b> kg`);
    set('diaCiclo', b.diaCiclo === '' ? '—' : `<b>${b.diaCiclo}º</b> dia na 1ª queda`);
    const pos = $(`[data-pos="${pre}posicao"]`); if (pos && pos.value !== b.posicao) pos.value = b.posicao;
  });
  // totais da estufa gravados nos campos "clássicos" (planilha e ficha continuam válidas)
  e.gradesCarregadas = gramposT || '';
  e.quantidadeCarregadaKg = e.boxes.length ? r2(kgT) : '';
  e.perdaTotalKg = e.boxes.length ? r2(perdaT) : '';
  e.desclassKg = e.boxes.length ? r2(descT) : '';
  e.perdaTotalPct = kgT ? r2(perdaT / kgT * 100) : '';
  e.desclassPct = kgT ? r2(descT / kgT * 100) : '';
  e.capacidadeMediaGrade = gramposT ? r2(kgT / gramposT) : '';
  e.boxesComPrejuizo = comPrej.join(', ');
  const tot = $(`[data-calc="estufas.${i}.totais"]`);
  if (tot) tot.innerHTML = e.boxes.length ? `<b>${fmtNum(e.quantidadeCarregadaKg)}</b> kg seco em ${e.boxes.length} box(es) (${fmtNum(gramposT)} grampos) · perda <b>${fmtNum(e.perdaTotalKg)}</b> kg (${fmtNum(e.perdaTotalPct)} %) · desclassificação <b>${fmtNum(e.desclassKg)}</b> kg (${fmtNum(e.desclassPct)} %) · boxes com prejuízo: <b>${e.boxesComPrejuizo || 'nenhum'}</b>` : '— adicione os boxes carregados';
}

function getPath(obj, path) { return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj); }
function setPath(obj, path, val) { const ks = path.split('.'); let o = obj; for (let i = 0; i < ks.length - 1; i++) { if (o[ks[i]] == null) o[ks[i]] = /^\d+$/.test(ks[i+1]) ? [] : {}; o = o[ks[i]]; } o[ks[ks.length-1]] = val; }
function mascaraCPF(v) { v = v.replace(/\D/g, '').slice(0, 11); return v.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2'); }
function mascaraFone(v) { v = v.replace(/\D/g, '').slice(0, 11); if (v.length > 6) return v.replace(/(\d{2})(\d{4,5})(\d{0,4})/, '($1) $2-$3'); if (v.length > 2) return v.replace(/(\d{2})(\d{0,5})/, '($1) $2'); return v; }
function cpfValido(cpf) { cpf = (cpf || '').replace(/\D/g, ''); if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) return false; let s = 0; for (let i = 0; i < 9; i++) s += +cpf[i] * (10 - i); let r = (s * 10) % 11; if (r === 10) r = 0; if (r !== +cpf[9]) return false; s = 0; for (let i = 0; i < 10; i++) s += +cpf[i] * (11 - i); r = (s * 10) % 11; if (r === 10) r = 0; return r === +cpf[10]; }

/* ====================== BANCO LOCAL (IndexedDB) ====================== */
const DB = (() => {
  let db;
  function abrir() {
    if (db) return Promise.resolve(db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('vistoriasFumo', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        d.createObjectStore('vistorias', { keyPath: 'id' });
        const f = d.createObjectStore('fotos', { keyPath: 'id' });
        f.createIndex('vistoriaId', 'vistoriaId');
        d.createObjectStore('config', { keyPath: 'k' });
      };
      r.onsuccess = () => { db = r.result; res(db); };
      r.onerror = () => rej(r.error);
    });
  }
  const tx = async (store, modo, fn) => { const d = await abrir(); return new Promise((res, rej) => { const t = d.transaction(store, modo); const s = t.objectStore(store); const req = fn(s); t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); };
  const req = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  return {
    put: (store, v) => tx(store, 'readwrite', s => s.put(v)),
    get: async (store, k) => { const d = await abrir(); return req(d.transaction(store).objectStore(store).get(k)); },
    del: (store, k) => tx(store, 'readwrite', s => s.delete(k)),
    all: async (store) => { const d = await abrir(); return req(d.transaction(store).objectStore(store).getAll()); },
    fotosDe: async (vid) => { const d = await abrir(); return req(d.transaction('fotos').objectStore('fotos').index('vistoriaId').getAll(vid)); },
  };
})();
async function getCfg() { const c = await DB.get('config', 'cfg'); return c ? c.v : { url: '', chave: '', vistoriador: '' }; }
async function setCfg(v) { await DB.put('config', { k: 'cfg', v }); }

function normalizarEstufa(e) {

  ['geradorTem', 'geradorAcionado', 'geradorTempoMin', 'geradorSuficiente', 'geradorObs', 'boxesTotal', 'fornalha', 'controlador', 'fornalhaAcesa'].forEach(k => { if (e[k] == null) e[k] = ''; });

  e.boxes.forEach(b => { if (!b.condicoes) b.condicoes = {}; });
  if (e.incendio == null) e.incendio = '';

      </div>
      <span class="badge st-${v.status}">${v.status === 'enviando' ? `Enviando ${sincronizar.pct || 0}%` : rotuloStatus[v.status]}</span>
      ${v.status !== 'enviando' ? `<button class="btn peq perigo x-lista" type="button" data-id="${v.id}" title="Excluir vistoria" style="padding:6px 9px;min-height:34px">🗑</button>` : ''}

/* ====================== VISTORIA: RENDER ====================== */
function campo(label, path, opts = {}) {
  const val = getPath(V, path) ?? '';
  const type = opts.type || 'text';
  const hint = opts.hint ? `<span class="hint">${esc(opts.hint)}</span>` : '';
  let inp;
  if (type === 'calc') inp = `<div class="calc" data-calc="${path}">${val === '' || val == null ? '—' : `<b>${fmtNum(val)}</b> kg`}</div>`;
  else if (type === 'textarea') inp = `<textarea data-path="${path}" placeholder="${esc(opts.placeholder || '')}">${esc(val)}</textarea>`;
  else if (type === 'select') inp = `<select data-path="${path}" ${opts.attr || ''}>${opts.opcoes.map(o => { const [k, r] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(k)}" ${k === val ? 'selected' : ''}>${esc(r) || '—'}</option>`; }).join('')}</select>`;
  else inp = `<input type="${type}" data-path="${path}" value="${esc(val)}" ${opts.list ? `list="${opts.list}"` : ''} ${opts.inputmode ? `inputmode="${opts.inputmode}"` : ''} ${opts.mask ? `data-mask="${opts.mask}"` : ''} ${type === 'number' ? 'step="any"' : ''} placeholder="${esc(opts.placeholder || '')}">`;
  return `<div class="campo"><label>${esc(label)}</label>${inp}${hint}</div>`;
}
function checkMulti(label, path, valor) {
  const arr = getPath(V, path) || []; const on = arr.includes(valor);
  return `<label class="chk ${on ? 'on' : ''}"><input type="checkbox" data-path="${path}" data-tipo="multi" value="${esc(valor)}" ${on ? 'checked' : ''}>${esc(label)}</label>`;
}
function radio(label, path, valor) {
  const on = getPath(V, path) === valor;
  return `<label class="chk ${on ? 'on' : ''}"><input type="radio" name="r-${path}" data-path="${path}" data-tipo="radio" value="${esc(valor)}" ${on ? 'checked' : ''}>${esc(label)}</label>`;
}

// Exclui a vistoria (de qualquer status) deste aparelho e, se já enviada, opcionalmente também do servidor
async function excluirVistoria(id) {
  const v = (V && V.id === id) ? V : await DB.get('vistorias', id); if (!v) return;
  const nome = v.produtor.nome || 'sem nome';
  const enviada = v.status === 'enviada' || !!v.pastaDriveUrl;
  if (!confirm(`Excluir a vistoria de "${nome}" e todas as suas fotos DESTE aparelho?`)) return;
  let noServidor = false;
  if (enviada) {
    noServidor = confirm(`Esta vistoria já foi ENVIADA.\n\nOK = apagar TAMBÉM na planilha e no Drive (a pasta do produtor vai para a lixeira do Drive).\nCancelar = apagar só deste aparelho (planilha e Drive ficam como estão).`);
    if (noServidor && !confirm(`Confirma apagar "${nome}" da planilha e do Drive? A pasta fica 30 dias na lixeira do Drive.`)) return;
  }
  if (noServidor) {
    if (!navigator.onLine) { toast('Sem internet: para apagar no servidor é preciso estar online', 4000); return; }
    try { toast('Apagando no servidor…', 10000); await api('excluir', { vistoriaId: id }); }
    catch (e) { if (!confirm('Falha ao apagar no servidor: ' + e.message + '\n\nApagar mesmo assim só deste aparelho?')) return; }
  }
  for (const f of await DB.fotosDe(id)) await DB.del('fotos', f.id);
  await DB.del('vistorias', id);
  clearTimeout(salvarTimer);
  if (V && V.id === id) { V = null; fotosCache = []; }   // impede que o salvamento automático recrie a vistoria
  toast(noServidor ? 'Vistoria excluída aqui e no servidor' : 'Vistoria excluída deste aparelho');
  if ($('#tela-lista').classList.contains('ativa')) renderLista(); else irLista();
}
async function concluirVistoria() {

    if (e.incendio === 'Sim') { const f = e.fogo, fotoDe = (k) => fotosCache.some(x => x.estufaId === e.id && x.categoria === k);

  const largura = rect.width || cv.parentElement.clientWidth || 340;
  cv.width = Math.round(largura * dpr); cv.height = Math.round(180 * dpr);
  const cx = cv.getContext('2d'); cx.scale(dpr, dpr); cx.lineWidth = 2.2; cx.lineCap = 'round'; cx.lineJoin = 'round'; cx.strokeStyle = '#111';
  cx.fillStyle = '#fff'; cx.fillRect(0, 0, largura, 180);
  if (V[chave]) { const img = new Image(); img.onload = () => cx.drawImage(img, 0, 0, largura, 180); img.src = V[chave]; }
  const st = $('#' + statusId); if (st) st.textContent = V[chave] ? 'assinatura registrada ✓' : 'sem assinatura';
  let desenhando = false, ultimo = null;
  const pos = (e) => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  cv.onpointerdown = (e) => { desenhando = true; ultimo = pos(e); cv.setPointerCapture(e.pointerId); e.preventDefault(); };
  cv.onpointermove = (e) => { if (!desenhando) return; const p = pos(e); cx.beginPath(); cx.moveTo(ultimo.x, ultimo.y); cx.lineTo(p.x, p.y); cx.stroke(); ultimo = p; e.preventDefault(); };
  const fim = () => { if (!desenhando) return; desenhando = false; if (!cv.width || !cv.height) return; V[chave] = cv.toDataURL('image/png'); if (st) st.textContent = 'assinatura registrada ✓'; marcarAlterada(); };
  cv.onpointerup = fim; cv.onpointercancel = fim; cv.onpointerleave = fim;
}
function limparAssinatura(chave) { V[chave] = null; marcarAlterada(); if (chave === 'assinatura') iniciarAssinatura('assinatura', 'assinatura', 'ass-status'); else iniciarAssinatura('assinatura-conjuge', 'assinaturaConjuge', 'ass-conjuge-status'); }

/* ====================== SINCRONIZAÇÃO (Google Apps Script) ====================== */
async function api(acao, dados) {
  const cfg = await getCfg();
  if (!cfg.url || !cfg.chave) throw new Error('Configure a URL do script e a chave da equipe em ⚙ Configurações');
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 240000);
  let r;
  try { r = await fetch(cfg.url, { method: 'POST', body: JSON.stringify({ acao, chave: cfg.chave, ...dados }), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, signal: ctrl.signal, redirect: 'follow' }); }
  catch (e) { throw new Error(e.name === 'AbortError' ? 'tempo esgotado (conexão lenta)' : 'sem conexão com o servidor (' + e.message + ')'); }
  finally { clearTimeout(t); }
  const txt = await r.text(); let j;
  try { j = JSON.parse(txt); } catch { throw new Error('resposta inválida do script (verifique a URL /exec e se a implantação está como "Qualquer pessoa")'); }
  if (!j.ok) throw new Error(j.erro || 'erro desconhecido no script');
  return j;
}
function vistoriaParaEnvio(v, fotos) {
  const { assinatura, assinaturaConjuge, ...resto } = v;
  return { ...resto, tipoVistoria: (v.estufas || []).some(e => e.incendio === 'Sim') ? 'Incêndio na estufa' : 'Queda de energia', temAssinatura: !!assinatura, temAssinaturaConjuge: !!assinaturaConjuge, fotos: fotos.map(f => ({ id: f.id, grupo: f.grupo, categoria: f.categoria, rotulo: f.rotulo, estufaIndex: f.estufaId ? v.estufas.findIndex(e => e.id === f.estufaId) + 1 : null, seq: f.seq, dataOriginal: f.dataOriginal, lat: f.lat, lng: f.lng, origem: f.origem, nomeBase: f.nomeBase })) };
}
async function sincronizar(manual) {
  if (sincronizando) return; if (!navigator.onLine) { if (manual) toast('Sem internet no momento'); return; }
  const cfg = await getCfg(); if (!cfg.url) { if (manual) { toast('Configure a URL do script em ⚙'); abrirConfig(); } return; }
  atualizarClientes(false);
  const pend = (await DB.all('vistorias')).filter(v => v.status === 'pronta' || v.status === 'erro' || v.status === 'enviando');
  if (!pend.length) { if (manual) toast('Nada pendente para enviar'); return; }
  sincronizando = true; let okN = 0;
  // total de passos para a porcentagem: dados + cada foto pendente + ficha, por vistoria
  const fotosPend = {}; let total = 0;
  for (const v of pend) { const fs = (await DB.fotosDe(v.id)).filter(f => !f.enviada); fotosPend[v.id] = fs.length; total += 2 + fs.length; }
  let feito = 0;
  const setMsg = (m, incremento) => {
    if (incremento) feito += incremento;
    sincronizar.pct = Math.min(100, Math.round(feito / Math.max(1, total) * 100)); sincronizar.msg = m;
    if (V && V.status === 'enviando') { renderRodape(); }
    if ($('#tela-lista').classList.contains('ativa')) { atualizarStatusSync(pend); $$('.card.lista .badge.st-enviando').forEach(b => b.textContent = `Enviando ${sincronizar.pct}%`); }
  };
  try {
    for (const v0 of pend) {
      const v = (V && V.id === v0.id) ? V : v0;
      v.status = 'enviando'; v.erro = ''; await DB.put('vistorias', v); if (V === v) renderRodape(); setMsg(v.produtor.nome);
      try {
        const fotos = await DB.fotosDe(v.id);
        const dados = vistoriaParaEnvio(v, fotos);
        setMsg(`${v.produtor.nome}: dados…`);
        const r1 = await api('upsert', { vistoria: dados });
        v.pastaDriveUrl = r1.pastaUrl || v.pastaDriveUrl;
        setMsg(`${v.produtor.nome}: dados enviados`, 1);
        const pendFotos = fotos.filter(f => !f.enviada);
        for (let i = 0; i < pendFotos.length; i++) {
          const f = pendFotos[i]; setMsg(`${v.produtor.nome}: foto ${i + 1}/${pendFotos.length}`);
          const meta = dados.fotos.find(x => x.id === f.id);
          await api('foto', { vistoriaId: v.id, foto: meta, base64: (await blobParaBase64(f.blob)).split(',')[1] });
          f.enviada = true; await DB.put('fotos', f);
          if (V === v) { const c = fotosCache.find(x => x.id === f.id); if (c) c.enviada = true; }
          setMsg(`${v.produtor.nome}: foto ${i + 1}/${pendFotos.length}`, 1);
        }
        setMsg(`${v.produtor.nome}: gerando ficha…`);
        const r3 = await api('finalizar', { vistoria: dados, assinaturaBase64: v.assinatura ? v.assinatura.split(',')[1] : null, assinaturaConjugeBase64: v.assinaturaConjuge ? v.assinaturaConjuge.split(',')[1] : null });
        v.status = 'enviada'; v.enviadaEm = new Date().toISOString(); v.fichaUrl = r3.fichaUrl || ''; v.pastaDriveUrl = r3.pastaUrl || v.pastaDriveUrl; okN++;
        setMsg(`${v.produtor.nome}: concluída`, 1);
      } catch (e) { v.status = 'erro'; v.erro = e.message; console.error(e); feito += 2 + (fotosPend[v.id] || 0); }
      await DB.put('vistorias', v);
      if (V === v) { try { renderVistoria(); } catch (e) { console.error(e); } }
    }
  } finally {
    sincronizando = false; sincronizar.msg = ''; sincronizar.pct = 0;
  }
  if ($('#tela-lista').classList.contains('ativa')) renderLista(); else if (V) renderRodape();
  toast(okN === pend.length ? `${okN} vistoria(s) enviada(s) com sucesso ✓` : `${okN} de ${pend.length} enviada(s). Verifique os erros na lista.`, 4000);
}

/* ====================== INICIALIZAÇÃO ====================== */
(async function init() {
  $('#versao').textContent = APP_VERSAO;
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch { }
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { navigator.serviceWorker.register('./sw.js').catch(e => console.warn('SW', e)); }
  await carregarClientesLocal();
  // vistorias que ficaram presas em "enviando" (app fechado no meio do envio) voltam para a fila
  for (const v of await DB.all('vistorias')) { if (v.status === 'enviando') { v.status = 'pronta'; await DB.put('vistorias', v); } }
  await renderLista();
  if (navigator.onLine) setTimeout(async () => { const cfg = await getCfg(); if (cfg.url) { atualizarClientes(false); sincronizar(false); } }, 1500);
  setInterval(() => { if (navigator.onLine && !sincronizando) sincronizar(false); }, 5 * 60 * 1000);
})();
